# When content changes (for example a save in /keystatic), fill in the missing
# English / Japanese / Spanish translations and commit them back.
# Runs an open model (M2M100) on the runner itself: no API key, no cost.
# Translations a human has ticked as "已校對" are never touched.
name: Translate content

on:
  push:
    paths:
      - "content/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: translate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  translate:
    # Only on the default branch, and never in response to its own commit.
    if: github.ref_name == github.event.repository.default_branch && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Cache the translation model
        uses: actions/cache@v4
        with:
          path: node_modules/@huggingface/transformers/.cache
          key: translate-model-m2m100-418m
      - run: npm run translate
      - name: Commit translations
        run: |
          if git diff --quiet -- content; then
            echo "Nothing to translate."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content
          git commit -m "Translate content (machine, unreviewed)"
          git push
