<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bounce</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
  p { position: absolute; top: 8px; left: 12px; margin: 0; color: #aaa; font: 13px sans-serif; }
</style>
</head>
<body>
<p>點擊畫面產生彈跳球</p>
<canvas id="c"></canvas>
<script>
  const c = document.getElementById("c");
  const ctx = c.getContext("2d");
  const balls = [];
  function resize() { c.width = innerWidth; c.height = innerHeight; }
  addEventListener("resize", resize); resize();
  c.addEventListener("pointerdown", (e) => {
    balls.push({ x: e.clientX, y: e.clientY, vx: (Math.random() - 0.5) * 8, vy: -6, r: 10 + Math.random() * 14, h: Math.random() * 360 });
  });
  (function loop() {
    ctx.fillStyle = "rgba(17,17,17,0.3)";
    ctx.fillRect(0, 0, c.width, c.height);
    for (const b of balls) {
      b.vy += 0.3; b.x += b.vx; b.y += b.vy;
      if (b.y + b.r > c.height) { b.y = c.height - b.r; b.vy *= -0.85; }
      if (b.x - b.r < 0 || b.x + b.r > c.width) b.vx *= -1;
      ctx.fillStyle = `hsl(${b.h} 80% 60%)`;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill();
    }
    requestAnimationFrame(loop);
  })();
</script>
</body>
</html>
