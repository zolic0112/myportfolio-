<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body style="margin:0">
<title>Space Dog 骨架測試</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one wide stage the dog lives on, a single row of controls under it. Single dark look on purpose: it stands in for the portfolio's space-black side. */
:root{
  --space:#07080d;
  --panel:#0e1018;
  --line:#2a2e3d;
  --silver:#c9ccd6;
  --dim:#7d8294;
  --signal:#9a86ea;
  --rot-bg:#008080;
  --f-display:"Instrument Serif","Times New Roman",serif;
  --f-body:"Inter",system-ui,-apple-system,"PingFang TC","Noto Sans TC",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
html,body{background:var(--space);color:var(--silver)}
body{font-family:var(--f-body);line-height:1.6;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:32px 48px}
.wrap{max-width:980px;margin:0 auto;display:grid;gap:22px}
header{display:grid;gap:6px}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(32px,6vw,50px);letter-spacing:.04em;line-height:1.05;margin:0;text-wrap:balance}
.lede{max-width:62ch;color:var(--dim);margin:0;font-size:14px}
.stage{position:relative;border:1px solid var(--line);border-radius:6px;height:440px;overflow:hidden;
  background:radial-gradient(ellipse at 50% 100%,#171a2b 0%,transparent 55%),radial-gradient(1px 1px at 12% 22%,#ffffff66,transparent),radial-gradient(1px 1px at 31% 61%,#ffffff33,transparent),radial-gradient(1px 1px at 58% 14%,#ffffff55,transparent),radial-gradient(1px 1px at 77% 43%,#ffffff44,transparent),radial-gradient(1px 1px at 91% 19%,#ffffff33,transparent),var(--space)}
.stage.rot{background:var(--rot-bg);border-color:#000}
.stage.rot::before{content:"";position:absolute;inset:0;background-image:radial-gradient(#00000022 1px,transparent 1px);background-size:6px 6px}
.stage::after{content:"";position:absolute;left:0;right:0;bottom:39px;height:1px;background:#ffffff1f}
canvas#view{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;touch-action:none;cursor:grab}
canvas#view.grabbing{cursor:grabbing}
.readout{position:absolute;left:12px;top:10px;z-index:2;font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;color:var(--dim);pointer-events:none}
.stage.rot .readout{color:#fff;background:#000;padding:2px 6px}
.controls{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px 16px;display:flex;flex-wrap:wrap;gap:14px 26px;align-items:center}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.seg button{all:unset;cursor:pointer;text-align:center;padding:8px 14px;font-size:13px;color:var(--dim)}
.seg button[aria-pressed="true"]{background:var(--silver);color:var(--space);font-weight:600}
.seg button:focus-visible,input:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
label.chk{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer}
input[type=checkbox]{accent-color:var(--signal)}
.note{font-size:12px;color:var(--dim);margin:0;max-width:70ch}
</style>

<div class="wrap">
  <header>
    <div class="eyebrow">Rig test · 程式骨架</div>
    <h1>抓起來甩甩看</h1>
    <p class="lede">這是用程式骨架動起來的 Space Dog：15 個部件各自掛在骨頭上，動作全部即時計算。用滑鼠或手指把牠抓起來拖，放開牠會掉回地面。眼睛會跟著你的游標。</p>
  </header>

  <div class="stage" id="stage">
    <div class="readout" id="readout">向量 · 60fps</div>
    <canvas id="view" aria-label="Space Dog 骨架測試舞台"></canvas>
  </div>

  <div class="controls">
    <div class="seg" role="group" aria-label="切換面">
      <button id="m-cool" aria-pressed="true">高冷</button>
      <button id="m-rot" aria-pressed="false">Brain rot</button>
    </div>
    <label class="chk" for="wander"><input type="checkbox" id="wander" checked>自己亂跑</label>
    <label class="chk" for="rim"><input type="checkbox" id="rim" checked>輪廓亮邊</label>
    <label class="chk" for="glow"><input type="checkbox" id="glow" checked>橘色發光</label>
    <label class="chk" for="virus"><input type="checkbox" id="virus" checked>病毒模式</label>
  </div>
  <p class="note">關掉「輪廓亮邊」可以看到深色身體在太空黑背景上消失的樣子。病毒模式只在 Brain rot 面作用。</p>
</div>

<script>
(() => {
  const DK='#1F1B33', PU='#7C63DB', OR='#FFA033';
  const PAL=[DK,PU,OR].map(h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]);
  const RIMPX=[104,92,190];
  const S=0.457, H=440, GROUND=H-40, G=[231,120], FEET=[231,488];
  const HY0=GROUND-(FEET[1]-G[1])*S;
  const $=id=>document.getElementById(id);
  const cv=$('view'), ctx=cv.getContext('2d'), stage=$('stage');
  const off=document.createElement('canvas'), octx=off.getContext('2d');
  const buf=document.createElement('canvas'), bctx=buf.getContext('2d',{willReadFrequently:true});
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce){ $('wander').checked=false; $('virus').checked=false; }
  let W=0, DPR=1;
  function resize(){
    DPR=Math.max(1,Math.min(3,window.devicePixelRatio||1)); W=cv.clientWidth||600;
    cv.width=off.width=Math.round(W*DPR); cv.height=off.height=Math.round(H*DPR);
    if (!st.hx || st.hx>W-60) st.hx=Math.min(W-60,Math.max(60,W*0.5));
  }

  // ---- parts: pivot + parent. Paths come straight from space-dog-parts.svg (v4) ----
  const parts={
    body:{p:null,pv:[231,426]}, head:{p:'body',pv:[231,298]}, crest:{p:'head',pv:[210,128]}, ear:{p:'head',pv:[312,150]},
    cheekL:{p:'head',pv:[170,262]}, cheekR:{p:'head',pv:[292,262]}, eyeL:{p:'head',pv:[197,212]}, eyeR:{p:'head',pv:[265,212]},
    armL:{p:'body',pv:[188,332]}, armR:{p:'body',pv:[274,332]}, legL:{p:null,pv:[198,418]}, legR:{p:null,pv:[264,418]}
  };
  const chainOrder=['body','head','crest','ear','cheekL','cheekR','eyeL','eyeR','armL','armR','legL','legR'];
  const drawOrder=['ear','legL','legR','body','armL','armR','head','cheekL','cheekR','eyeL','eyeR','crest'];
  const P=d=>new Path2D(d);
  const path={
    ear:P('M304,160 C302,128 318,100 344,82 C358,74 370,86 366,100 C358,126 342,146 324,162 Z'),
    legL:P('M188,404 h20 a8,8 0 0 1 8,8 v68 a8,8 0 0 1 -8,8 h-20 a8,8 0 0 1 -8,-8 v-68 a8,8 0 0 1 8,-8 Z'),
    footL:P('M100,484 C100,456 120,440 144,440 C170,440 190,456 190,484 Z'),
    legR:P('M254,404 h20 a8,8 0 0 1 8,8 v68 a8,8 0 0 1 -8,8 h-20 a8,8 0 0 1 -8,-8 v-68 a8,8 0 0 1 8,-8 Z'),
    footR:P('M362,484 C362,456 342,440 318,440 C292,440 272,456 272,484 Z'),
    torso:P('M200,296 C182,312 172,336 172,366 C172,398 186,424 204,430 L258,430 C276,424 290,398 290,366 C290,336 280,312 262,296 Z'),
    belly:P('M231,322 C244,340 260,360 260,382 C260,400 247,410 231,410 C215,410 202,400 202,382 C202,360 218,340 231,322 Z'),
    armL:P('M190,326 C174,330 158,352 152,376 C148,392 158,402 170,400 C182,398 190,384 194,366 C198,350 198,336 190,326 Z'),
    armR:P('M272,326 C288,330 304,352 310,376 C314,392 304,402 292,400 C280,398 272,384 268,366 C264,350 264,336 272,326 Z'),
    head:P('M128,208 C128,142 172,112 231,112 C290,112 334,142 334,208 C334,266 296,302 231,302 C166,302 128,266 128,208 Z'),
    browL:P('M204,144 Q172,148 164,180'), browR:P('M258,144 Q290,148 298,180'),
    cheekL:P('M150,218 C142,240 124,252 104,260 C102,274 122,284 144,288 C164,292 182,292 194,286 C172,272 158,250 150,218 Z'),
    cheekR:P('M312,218 C320,240 338,252 358,260 C360,274 340,284 318,288 C298,292 280,292 268,286 C290,272 304,250 312,218 Z'),
    crest:P('M30,66 C52,38 96,12 140,10 C178,8 202,32 222,58 C242,86 256,106 268,130 C240,122 200,122 178,128 C172,142 166,156 154,164 C146,160 142,152 140,144 C132,124 116,108 92,98 C68,90 46,84 32,76 C28,73 28,69 30,66 Z'),
    blade:P('M42,66 C66,42 104,22 138,20 C158,48 172,86 168,120 C166,136 160,148 154,154 C144,124 128,102 104,90 C82,82 60,76 42,66 Z')
  };
  const BEADS=[[146,424,17],[112,394,19],[72,358,22]];

  // ---- state ----
  const st={hx:0,hy:HY0,vy:0,th:0,thv:0,q:0,qv:0,pvx:0,grab:false,gdx:0,gdy:0,
    hop:0,hopDir:1,target:null,wait:1.2,cr:0,crv:0,er:0,erv:0,beads:null};
  const ptr={x:-999,y:-999,down:false};
  const pose={}; for (const k in parts) pose[k]={r:0,x:0,y:0,sx:1,sy:1};
  const world={};

  function update(dt,t){
    const prevHx=st.hx;
    const onGround=!st.grab && st.hy>=HY0-0.01 && st.hop===0;
    if (st.grab){
      st.hx+=(ptr.x+st.gdx-st.hx)*Math.min(1,dt*28);
      st.hy+=(ptr.y+st.gdy-st.hy)*Math.min(1,dt*28);
      st.vy=0; st.hop=0; st.target=null;
    } else if (st.hop>0){
      st.hop+=dt/0.3;
      st.hx+=st.hopDir*96*dt;
      st.hy=HY0-Math.sin(Math.PI*Math.min(1,st.hop))*16;
      if (st.hop>=1){ st.hop=0; st.hy=HY0; st.qv+=1.5;
        if (st.target===null || Math.abs(st.target-st.hx)<16){ st.target=null; st.wait=1.4+Math.random()*2.6; }
        else st.hop=0.0001;
      }
    } else if (st.hy<HY0){
      st.vy+=2300*dt; st.hy+=st.vy*dt;
      if (st.hy>=HY0){ st.hy=HY0; st.qv+=Math.min(st.vy,1400)*0.0042; st.vy=0; st.wait=0.9; }
    } else if ($('wander').checked){
      st.wait-=dt;
      if (st.wait<=0 && st.target===null){
        st.target=70+Math.random()*Math.max(10,W-140);
        st.hopDir=st.target>st.hx?1:-1; st.hop=0.0001;
      }
    }
    st.hx=Math.min(W-50,Math.max(50,st.hx));
    st.pvx+=((st.hx-prevHx)/dt-st.pvx)*Math.min(1,dt*18);
    const thT=st.grab?Math.max(-1,Math.min(1,st.pvx*0.0016)):0;
    st.thv+=((thT-st.th)*(st.grab?70:120)-st.thv*(st.grab?5:12))*dt; st.th+=st.thv*dt;
    st.qv+=(-st.q*230-st.qv*15)*dt; st.q+=st.qv*dt;
    const lagT=-st.pvx*0.03-st.thv*6;
    st.crv+=((lagT-st.cr)*60-st.crv*7)*dt; st.cr+=st.crv*dt;
    st.erv+=((lagT*1.4-st.er)*110-st.erv*8)*dt; st.er+=st.erv*dt;

    // pose
    const air=!st.grab && st.hy<HY0-1 && st.hop===0, hopS=st.hop>0?Math.sin(Math.PI*Math.min(1,st.hop)):0;
    const z=k=>{const p=pose[k];p.r=0;p.x=0;p.y=0;p.sx=1;p.sy=1;return p;};
    z('body').y=Math.sin(t*2.4)*2.2; pose.body.r=st.hop>0?st.hopDir*5*hopS:0;
    z('head').r=Math.sin(t*1.1)*2-st.th*10; pose.head.y=Math.sin(t*2.4+0.7)*1.6;
    z('crest').r=Math.sin(t*1.7+1)*3+st.cr;
    z('ear').r=Math.sin(t*2.3)*4+st.er+((t%5.3)<0.16?-14:0);
    z('cheekL').r=Math.sin(t*2)*3+st.cr*0.4; z('cheekR').r=-Math.sin(t*2+0.5)*3+st.cr*0.4;
    const flail=st.grab?1:air?0.7:0;
    z('armL').r=4+Math.sin(t*2.4)*3+flail*(70+Math.sin(t*19)*28)+hopS*24;
    z('armR').r=-4-Math.sin(t*2.4)*3-flail*(70+Math.sin(t*19+1.3)*28)-hopS*24;
    z('legL').r=flail*Math.sin(t*16)*26+hopS*14; z('legR').r=-flail*Math.sin(t*16)*26-hopS*14;
    const ex=st.hx, ey=st.hy+(212-G[1])*S; let dx=ptr.x-ex, dy=ptr.y-ey; const d=Math.hypot(dx,dy)||1;
    const m=ptr.x<-900?0:Math.min(1,d/180)*6; dx=dx/d*m; dy=dy/d*m;
    const blink=(t%3.9)<0.12 && !st.grab;
    for (const k of ['eyeL','eyeR']){ const p=z(k); p.x=dx; p.y=dy; p.sy=blink?0.08:st.grab?1.1:1; }

    // matrices in css px
    const sq=st.q;
    const B=new DOMMatrix().translate(st.hxDraw??st.hx,st.hyDraw??st.hy).rotate(st.th*57.2958).scale(S).translate(-G[0],-G[1])
      .translate(FEET[0],FEET[1]).scale(1+sq*0.6,1-sq).translate(-FEET[0],-FEET[1]);
    for (const k of chainOrder){
      const pt=parts[k], p=pose[k], base=pt.p?world[pt.p]:B;
      world[k]=base.translate(pt.pv[0]+p.x,pt.pv[1]+p.y).rotate(p.r).scale(p.sx,p.sy).translate(-pt.pv[0],-pt.pv[1]);
    }
    // tail beads trail behind the body
    const K=[24,13,8];
    if (!st.beads) st.beads=BEADS.map(b=>{const q=world.body.transformPoint({x:b[0],y:b[1]});return {x:q.x,y:q.y};});
    BEADS.forEach((b,i)=>{
      const q=world.body.transformPoint({x:b[0],y:b[1]}); q.y+=Math.sin(t*2.2+i*1.1)*2.5;
      const a=1-Math.exp(-dt*K[i]); st.beads[i].x+=(q.x-st.beads[i].x)*a; st.beads[i].y+=(q.y-st.beads[i].y)*a;
    });
  }

  function drawDog(c,V,flat,glowPx){
    const glow=on=>{ if (flat||!$('glow').checked) return; c.shadowColor=on?'rgba(255,140,30,.95)':'transparent'; c.shadowBlur=on?glowPx:0; };
    c.lineJoin='round'; c.lineCap='round';
    c.setTransform(V);
    BEADS.forEach((b,i)=>{
      const p=st.beads[i], r=b[2]*S; c.beginPath(); c.arc(p.x,p.y,r,0,Math.PI*2);
      if (flat) c.fillStyle=OR; else { const g=c.createRadialGradient(p.x-r*0.3,p.y-r*0.35,r*0.1,p.x,p.y,r); g.addColorStop(0,'#FFD98A'); g.addColorStop(1,OR); c.fillStyle=g; }
      glow(true); c.fill(); glow(false);
    });
    const soft=(p)=>{ c.fillStyle=PU; c.fill(p); c.strokeStyle=DK; c.lineWidth=8; c.stroke(p); };
    for (const k of drawOrder){
      c.setTransform(V.multiply(world[k]));
      if (k==='ear') soft(path.ear);
      else if (k==='legL'){ c.fillStyle=DK; c.fill(path.legL); soft(path.footL); }
      else if (k==='legR'){ c.fillStyle=DK; c.fill(path.legR); soft(path.footR); }
      else if (k==='body'){ c.fillStyle=DK; c.fill(path.torso); c.fillStyle=OR; glow(true); c.fill(path.belly); glow(false); }
      else if (k==='armL') soft(path.armL);
      else if (k==='armR') soft(path.armR);
      else if (k==='head'){ c.fillStyle=DK; c.fill(path.head); c.strokeStyle=PU; c.lineWidth=14; c.stroke(path.browL); c.stroke(path.browR);
        c.fillStyle=OR; glow(true); c.beginPath(); c.ellipse(231,272,32,14,0,0,Math.PI*2); c.fill(); glow(false); }
      else if (k==='cheekL') soft(path.cheekL);
      else if (k==='cheekR') soft(path.cheekR);
      else if (k==='eyeL'||k==='eyeR'){ const x=k==='eyeL'?197:265; c.fillStyle=OR; glow(true); c.beginPath(); c.ellipse(x,212,16,38,0,0,Math.PI*2); c.fill(); glow(false); }
      else if (k==='crest'){ c.fillStyle=DK; c.fill(path.crest); c.fillStyle=PU; c.fill(path.blade); }
    }
    c.setTransform(1,0,0,1,0,0);
  }

  function renderSmooth(){
    octx.setTransform(1,0,0,1,0,0); octx.clearRect(0,0,off.width,off.height);
    drawDog(octx,new DOMMatrix().scale(DPR),false,13*DPR);
    ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,cv.width,cv.height); ctx.imageSmoothingEnabled=true;
    if ($('rim').checked){ ctx.shadowColor='rgba(160,146,240,.95)'; ctx.shadowBlur=2.4*DPR; ctx.drawImage(off,0,0); ctx.drawImage(off,0,0); ctx.shadowBlur=0; ctx.shadowColor='transparent'; }
    ctx.drawImage(off,0,0);
  }

  // ---- pixel filters ----
  function quantize(d,w,h){
    for (let i=0;i<d.length;i+=4){
      if (d[i+3]<110){ d[i+3]=0; continue; }
      d[i+3]=255; let best=0,bd=1e9;
      for (let p=0;p<3;p++){ const c=PAL[p], e=(d[i]-c[0])**2+(d[i+1]-c[1])**2+(d[i+2]-c[2])**2; if (e<bd){bd=e;best=p;} }
      d[i]=PAL[best][0]; d[i+1]=PAL[best][1]; d[i+2]=PAL[best][2];
    }
    if (!$('rim').checked) return;
    const a=new Uint8Array(w*h); for (let i=0;i<w*h;i++) a[i]=(d[i*4+3] && d[i*4]!==PAL[2][0])?1:0;
    for (let y=0;y<h;y++) for (let x=0;x<w;x++){
      const j=y*w+x; if (d[j*4+3]) continue;
      if ((x>0&&a[j-1])||(x<w-1&&a[j+1])||(y>0&&a[j-w])||(y<h-1&&a[j+w])){ const i=j*4; d[i]=RIMPX[0]; d[i+1]=RIMPX[1]; d[i+2]=RIMPX[2]; d[i+3]=255; }
    }
  }
  function fried(d,w,h){
    const bl={};
    for (let y=0;y<h;y++) for (let x=0;x<w;x++){
      const i=(y*w+x)*4; if (!d[i+3]) continue;
      const key=(x>>2)+','+(y>>2), b=bl[key]||(bl[key]=[(Math.random()-.5)*70,(Math.random()-.5)*70,(Math.random()-.5)*70]);
      const avg=(d[i]+d[i+1]+d[i+2])/3;
      for (let c=0;c<3;c++){ let v=avg+(d[i+c]-avg)*2.4; v=(v-128)*1.5+128+b[c]+(Math.random()-.5)*60; d[i+c]=Math.round(Math.max(0,Math.min(255,v))/64)*64; }
    }
  }
  function split(d,w,h){
    const s=d.slice(), sh=1+(Math.random()<.4);
    for (let y=0;y<h;y++) for (let x=0;x<w;x++){
      const i=(y*w+x)*4, l=(y*w+Math.max(0,x-sh))*4, r=(y*w+Math.min(w-1,x+sh))*4;
      d[i]=s[l]; d[i+2]=s[r+2]; d[i+3]=Math.max(s[i+3],s[l+3],s[r+3]); if (!s[i+3]) d[i+1]=0;
    }
  }
  function slices(d,w,h){
    const s=d.slice(); let y=0;
    while (y<h){
      const band=2+(Math.random()*8|0), o=Math.random()<.5?0:((Math.random()*9|0)-4);
      for (let yy=y;yy<Math.min(h,y+band);yy++) for (let x=0;x<w;x++){
        const sx=x-o, i=(yy*w+x)*4; if (sx<0||sx>=w){ d[i+3]=0; continue; }
        const j=(yy*w+sx)*4; d[i]=s[j]; d[i+1]=s[j+1]; d[i+2]=s[j+2]; d[i+3]=s[j+3];
      }
      y+=band;
    }
  }
  function invert(d){ for (let i=0;i<d.length;i+=4){ if (!d[i+3]) continue; d[i]=255-d[i]; d[i+1]=255-d[i+1]; d[i+2]=255-d[i+2]; } }

  function renderPixel(cell,fx){
    const w=Math.ceil(W/cell), h=Math.ceil(H/cell);
    if (buf.width!==w||buf.height!==h){ buf.width=w; buf.height=h; }
    bctx.setTransform(1,0,0,1,0,0); bctx.clearRect(0,0,w,h);
    drawDog(bctx,new DOMMatrix().scale(1/cell),true,0);
    const img=bctx.getImageData(0,0,w,h), d=img.data;
    quantize(d,w,h);
    if (fx==='fried') fried(d,w,h); else if (fx==='split') split(d,w,h); else if (fx==='slices') slices(d,w,h); else if (fx==='invert') invert(d);
    bctx.putImageData(img,0,0);
    ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,cv.width,cv.height); ctx.imageSmoothingEnabled=false;
    ctx.drawImage(buf,0,0,w*cell*DPR,h*cell*DPR);
  }

  // ---- mode + virus state ----
  let mode='cool', fx='pixel', fxUntil=0, trans=null, lastFi=-1;
  const NAMES={pixel:'像素',fried:'深炸',split:'色彩錯位',slices:'畫面撕裂',crunch:'解析度崩潰',invert:'反相',smooth:'變回向量'};
  const POOL=[['pixel',6,1200,3400],['fried',2,400,1500],['split',2,150,600],['slices',2,100,380],['crunch',1,200,600],['smooth',1,80,240],['invert',1,60,150]];
  function pickFx(now){
    let r=Math.random()*POOL.reduce((s,p)=>s+p[1],0), p=POOL[0];
    for (const q of POOL){ if ((r-=q[1])<=0){ p=q; break; } }
    if (p[0]===fx && p[0]!=='pixel') p=POOL[0];
    fx=p[0]; fxUntil=now+p[2]+Math.random()*(p[3]-p[2]);
  }
  function setMode(next){
    if (next===mode && !trans) return;
    const now=performance.now();
    trans=next==='rot'?{steps:[2,3,4],i:0,at:now,fx:'fried',done(){mode='rot';fx='pixel';fxUntil=performance.now()+1500;}}
                      :{steps:[4,3,2],i:0,at:now,fx:'pixel',done(){mode='cool';}};
    stage.classList.toggle('rot',next==='rot');
    $('m-cool').setAttribute('aria-pressed',next==='cool'); $('m-rot').setAttribute('aria-pressed',next==='rot');
  }
  $('m-cool').addEventListener('click',()=>setMode('cool'));
  $('m-rot').addEventListener('click',()=>setMode('rot'));

  // ---- pointer ----
  const local=e=>{ const r=cv.getBoundingClientRect(); ptr.x=e.clientX-r.left; ptr.y=e.clientY-r.top; };
  cv.addEventListener('pointerdown',e=>{
    local(e);
    if (Math.abs(ptr.x-st.hx)<105 && ptr.y>st.hy-70 && ptr.y<st.hy+190){
      st.grab=true; st.gdx=st.hx-ptr.x; st.gdy=st.hy-ptr.y; cv.setPointerCapture(e.pointerId); cv.classList.add('grabbing');
    }
  });
  window.addEventListener('pointermove',local);
  const drop=()=>{ if (st.grab){ st.grab=false; cv.classList.remove('grabbing'); } };
  cv.addEventListener('pointerup',drop); cv.addEventListener('pointercancel',drop);

  // ---- loop ----
  let last=performance.now();
  function frame(now){
    const dt=Math.min(0.033,Math.max(0.001,(now-last)/1000)); last=now;
    const t=now/1000, pixelish=mode==='rot'||trans;
    const cell=trans?trans.steps[trans.i]:(fx==='crunch'?(Math.random()<.5?12:8):4);
    if (pixelish && fx!=='smooth'){ st.hxDraw=Math.round(st.hx/cell)*cell; st.hyDraw=Math.round(st.hy/cell)*cell; } else { st.hxDraw=undefined; st.hyDraw=undefined; }
    update(dt,reduce?0:t);
    let label;
    if (trans){
      renderPixel(cell,trans.fx); label='切換中';
      if (now-trans.at>110){ trans.i++; trans.at=now; if (trans.i>=trans.steps.length){ const x=trans; trans=null; x.done(); } }
    } else if (mode==='cool'){ renderSmooth(); label='向量 · 60fps'; }
    else {
      if (now>fxUntil){ if ($('virus').checked) pickFx(now); else fx='pixel'; }
      if (fx==='smooth'){ renderSmooth(); label='變回向量 · 60fps'; }
      else { const fi=Math.floor(t*12); if (fi!==lastFi){ lastFi=fi; renderPixel(cell,fx); } label=NAMES[fx]+' · 12fps'; }
    }
    if ($('readout').textContent!==label) $('readout').textContent=label;
    requestAnimationFrame(frame);
  }
  resize(); window.addEventListener('resize',resize);
  requestAnimationFrame(frame);
})();
</script>
