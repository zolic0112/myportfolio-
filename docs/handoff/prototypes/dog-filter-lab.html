<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body style="margin:0">
<title>寵物像素化濾鏡實驗</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one stage (the pet) beside a narrow instrument panel; stacks on phones. Single dark look on purpose: it mirrors the portfolio's space-black side. */
:root{
  --space:#07080d;
  --panel:#0e1018;
  --line:#2a2e3d;
  --silver:#c9ccd6;
  --dim:#7d8294;
  --signal:#8c93ff;
  --rot-bg:#008080;
  --f-display:"Instrument Serif","Times New Roman",serif;
  --f-body:"Inter",system-ui,-apple-system,"PingFang TC","Noto Sans TC",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
html,body{background:var(--space);color:var(--silver)}
body{font-family:var(--f-body);line-height:1.6;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:32px 48px}
.wrap{max-width:980px;margin:0 auto;display:grid;gap:28px}
header{display:grid;gap:6px}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(34px,6vw,54px);letter-spacing:.04em;line-height:1.05;margin:0;color:var(--silver);text-wrap:balance}
.lede{max-width:62ch;color:var(--dim);margin:0;font-size:14px}
.main{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:24px;align-items:start}
@media (max-width:760px){.main{grid-template-columns:minmax(0,1fr)}}
.stage{position:relative;border:1px solid var(--line);border-radius:6px;min-height:460px;display:grid;place-items:center;overflow:hidden;
  background:radial-gradient(ellipse at 50% 85%,#1a1d2e 0%,transparent 60%),radial-gradient(1px 1px at 20% 30%,#ffffff55,transparent),radial-gradient(1px 1px at 72% 18%,#ffffff44,transparent),radial-gradient(1px 1px at 85% 62%,#ffffff33,transparent),radial-gradient(1px 1px at 12% 74%,#ffffff33,transparent),var(--space);
  transition:background-color .2s}
.stage.rot{background:var(--rot-bg);border-color:#000}
.stage.rot::after{content:"";position:absolute;inset:0;background-image:radial-gradient(#00000022 1px,transparent 1px);background-size:6px 6px;pointer-events:none}
canvas#view{width:240px;height:400px;image-rendering:pixelated;position:relative;z-index:1}
.readout{position:absolute;left:12px;top:10px;z-index:2;font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;color:var(--dim)}
.stage.rot .readout{color:#fff;background:#000;padding:2px 6px}
.tag{position:absolute;right:12px;bottom:10px;z-index:2;font-family:var(--f-mono);font-size:10px;color:var(--dim);letter-spacing:.08em}
.stage.rot .tag{color:#ffffffaa}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:18px;display:grid;gap:18px}
.group{display:grid;gap:8px}
.label{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.seg button{all:unset;cursor:pointer;text-align:center;padding:10px 8px;font-size:13px;color:var(--dim)}
.seg button[aria-pressed="true"]{background:var(--silver);color:var(--space);font-weight:600}
.seg button:focus-visible,.fx button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:13px}
select,input[type=range]{accent-color:var(--signal)}
select{background:var(--space);color:var(--silver);border:1px solid var(--line);border-radius:4px;padding:6px 8px;font:inherit;font-size:13px}
input[type=range]{width:140px}
.val{font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums;color:var(--silver);min-width:4ch;text-align:right}
.fx{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.fx button{all:unset;cursor:pointer;text-align:center;border:1px solid var(--line);border-radius:4px;padding:8px 4px;font-size:12px;color:var(--silver)}
.fx button:hover{border-color:var(--signal)}
.fx button:disabled{opacity:.35;cursor:not-allowed}
.note{font-size:12px;color:var(--dim);margin:0;max-width:62ch}
.note strong{color:var(--silver);font-weight:500}
</style>

<div class="wrap">
  <header>
    <div class="eyebrow">Filter test · Rive 前置驗證</div>
    <h1>同一隻狗，兩種皮</h1>
    <p class="lede">左邊的角色是用向量即時畫出來的（模擬 Rive 的輸出），右邊的面板決定它怎麼被渲染。切到 Brain rot 就是在網頁端套一層像素化濾鏡，打開病毒模式它會自己亂切狀態。移動滑鼠，眼睛會跟著你。</p>
  </header>

  <div class="main">
    <div class="stage" id="stage">
      <div class="readout" id="readout">向量 · 60fps</div>
      <canvas id="view" aria-label="測試用角色"></canvas>
      <div class="tag">佔位角色，不是 Space Dog</div>
    </div>

    <aside class="panel">
      <div class="group">
        <div class="label">面</div>
        <div class="seg" role="group" aria-label="切換面">
          <button id="m-cool" aria-pressed="true">高冷 · 向量</button>
          <button id="m-rot" aria-pressed="false">Brain rot · 像素</button>
        </div>
      </div>

      <div class="group">
        <div class="label">像素濾鏡</div>
        <label class="row" for="virus">病毒模式（自動亂切）<input type="checkbox" id="virus" checked></label>
        <label class="row" for="res">像素格數
          <select id="res">
            <option value="30">30 × 50</option>
            <option value="48" selected>48 × 80（原像素狗）</option>
            <option value="60">60 × 100</option>
          </select>
        </label>
        <label class="row" for="fps">幀率 <span style="display:flex;gap:8px;align-items:center"><input type="range" id="fps" min="6" max="30" value="12"><span class="val" id="fpsv">12</span></span></label>
        <label class="row" for="quant">調色盤量化<input type="checkbox" id="quant" checked></label>
      </div>

      <div class="group">
        <div class="label">手動觸發</div>
        <div class="fx" id="fx">
          <button data-s="fried">深炸</button>
          <button data-s="split">色彩錯位</button>
          <button data-s="slices">畫面撕裂</button>
          <button data-s="crunch">解析度崩潰</button>
          <button data-s="invert">反相</button>
          <button data-s="smooth">變回向量</button>
        </div>
      </div>

      <p class="note">試試把<strong>調色盤量化</strong>關掉，就會看到單純縮小放大的「髒馬賽克」；把<strong>幀率</strong>拉到 30，會發現卡卡的復古感消失。</p>
    </aside>
  </div>
</div>

<script>
(() => {
  const LW = 240, LH = 400;
  const view = document.getElementById('view');
  const k = Math.max(1, Math.ceil(window.devicePixelRatio || 1));
  view.width = LW * k; view.height = LH * k;
  const vctx = view.getContext('2d');
  const buf = document.createElement('canvas');
  const bctx = buf.getContext('2d', { willReadFrequently: true });

  const C = { navy:'#0b1240', blue:'#6b72f0', light:'#a3a8ff', orange:'#ff8a3d', deep:'#04061a', cream:'#ffd9b3' };
  const PAL = Object.values(C).map(h => [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)]);

  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const ui = {
    stage: document.getElementById('stage'), readout: document.getElementById('readout'),
    cool: document.getElementById('m-cool'), rot: document.getElementById('m-rot'),
    virus: document.getElementById('virus'), res: document.getElementById('res'),
    fps: document.getElementById('fps'), fpsv: document.getElementById('fpsv'),
    quant: document.getElementById('quant'), fx: document.getElementById('fx')
  };
  if (reduce) ui.virus.checked = false;

  let mode = 'cool';            // 'cool' | 'rot'
  let state = 'pixel';          // current brain rot visual state
  let stateUntil = 0;
  let transition = null;        // {steps:[res...], i, next, then}
  const pointer = { x: 120, y: 120 };

  const NAMES = { pixel:'像素', fried:'深炸', split:'色彩錯位', slices:'畫面撕裂', crunch:'解析度崩潰', invert:'反相', smooth:'變回向量' };
  const POOL = [ ['pixel',6,1200,3400], ['fried',2,400,1500], ['split',2,150,600], ['slices',2,100,380], ['crunch',1,200,600], ['smooth',1,80,240], ['invert',1,60,150] ];

  function pickState(now){
    const total = POOL.reduce((s,p)=>s+p[1],0);
    let r = Math.random()*total, p = POOL[0];
    for (const q of POOL){ if ((r -= q[1]) <= 0){ p = q; break; } }
    if (p[0] === state && p[0] !== 'pixel') p = POOL[0];
    state = p[0];
    stateUntil = now + p[2] + Math.random()*(p[3]-p[2]);
  }
  function trigger(s, now){ state = s; const p = POOL.find(q=>q[0]===s); stateUntil = now + Math.max(p[3], 500); }

  window.addEventListener('pointermove', e => {
    const r = view.getBoundingClientRect();
    pointer.x = (e.clientX - r.left) / r.width * LW;
    pointer.y = (e.clientY - r.top) / r.height * LH;
  });

  function ell(ctx,x,y,rx,ry,fill,stroke,lw,rot=0){
    ctx.beginPath(); ctx.ellipse(x,y,rx,ry,rot,0,Math.PI*2);
    if (stroke){ ctx.lineWidth = lw; ctx.strokeStyle = stroke; ctx.stroke(); }
    if (fill){ ctx.fillStyle = fill; ctx.fill(); }
  }

  // The placeholder character, drawn in a 240×400 space. Each part sways on its own "bone".
  function drawDog(ctx, t){
    const bob = Math.sin(t*2.2)*4;
    // tail
    ctx.save(); ctx.translate(76, 312+bob*0.4); ctx.rotate(-0.5 + Math.sin(t*3.1)*0.35);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(-22,-18); ctx.lineTo(-30,-44); ctx.lineTo(-48,-62);
    ctx.strokeStyle = C.navy; ctx.lineWidth = 22; ctx.stroke();
    ctx.strokeStyle = C.orange; ctx.lineWidth = 12; ctx.stroke();
    ctx.restore();
    // feet
    for (const s of [-1,1]) ell(ctx, 120+s*34, 368, 30, 15, C.blue, C.navy, 10);
    // body + belly + arms
    ell(ctx, 120, 302+bob*0.5, 54, 58, C.navy);
    ell(ctx, 120, 316+bob*0.5, 24, 32, C.orange);
    for (const s of [-1,1]) ell(ctx, 120+s*52, 300+bob*0.5, 13, 24, C.blue, C.navy, 8, s*0.35 + Math.sin(t*2.2+s)*0.08);
    // head group
    ctx.save(); ctx.translate(120, 190+bob); ctx.rotate(Math.sin(t*1.3)*0.05);
    // ear
    ctx.save(); ctx.translate(40,-44); ctx.rotate(0.3 + Math.sin(t*2.7)*0.14);
    ctx.beginPath(); ctx.moveTo(-16,6); ctx.quadraticCurveTo(-6,-70,10,-64); ctx.quadraticCurveTo(20,-20,18,10); ctx.closePath();
    ctx.lineWidth = 10; ctx.strokeStyle = C.navy; ctx.stroke(); ctx.fillStyle = C.blue; ctx.fill();
    ctx.beginPath(); ctx.moveTo(-4,0); ctx.quadraticCurveTo(0,-44,8,-48); ctx.quadraticCurveTo(10,-20,8,2); ctx.fillStyle = C.light; ctx.fill();
    ctx.restore();
    // head
    ell(ctx, 0, 0, 72, 62, C.blue, C.navy, 12);
    ell(ctx, 0, 14, 50, 36, C.light);
    // hat
    ctx.save(); ctx.translate(-14,-46); ctx.rotate(-0.25 + Math.sin(t*1.7)*0.06);
    ctx.beginPath(); ctx.moveTo(-58,16); ctx.quadraticCurveTo(-70,-40,-118,-92); ctx.quadraticCurveTo(-40,-70,4,-30); ctx.quadraticCurveTo(30,-10,44,10); ctx.closePath();
    ctx.lineWidth = 10; ctx.strokeStyle = C.navy; ctx.stroke(); ctx.fillStyle = C.navy; ctx.fill();
    ctx.beginPath(); ctx.moveTo(-50,4); ctx.quadraticCurveTo(-64,-36,-98,-74); ctx.quadraticCurveTo(-52,-50,-30,-20); ctx.closePath(); ctx.fillStyle = C.blue; ctx.fill();
    ctx.restore();
    // eyes follow the pointer
    const hx = 120, hy = 190+bob;
    let dx = pointer.x - hx, dy = pointer.y - hy; const d = Math.hypot(dx,dy) || 1;
    const m = Math.min(1, d/140) * 6; dx = dx/d*m; dy = dy/d*m;
    const blink = (t % 3.7) < 0.13;
    for (const s of [-1,1]){
      const ex = s*24, ey = -2;
      ell(ctx, ex, ey, 13, blink ? 2.5 : 22, C.orange, C.navy, 6);
      if (!blink) ell(ctx, ex+dx, ey+dy, 5.5, 9, C.deep);
    }
    ell(ctx, 0, 30, 15, 8, C.orange, C.navy, 5);
    ctx.restore();
  }

  // ---- pixel filters on the small buffer ----
  function quantize(d){
    for (let i=0;i<d.length;i+=4){
      if (d[i+3] < 110){ d[i+3]=0; continue; }
      d[i+3]=255;
      if (!ui.quant.checked) continue;
      let best=0, bd=1e9;
      for (let p=0;p<PAL.length;p++){
        const c=PAL[p], e=(d[i]-c[0])**2+(d[i+1]-c[1])**2+(d[i+2]-c[2])**2;
        if (e<bd){bd=e;best=p;}
      }
      d[i]=PAL[best][0]; d[i+1]=PAL[best][1]; d[i+2]=PAL[best][2];
    }
  }
  function fried(d,w,h){
    const blocks = {};
    for (let y=0;y<h;y++) for (let x=0;x<w;x++){
      const i=(y*w+x)*4; if (!d[i+3]) continue;
      const key=(x>>2)+','+(y>>2);
      const b = blocks[key] || (blocks[key]=[(Math.random()-.5)*70,(Math.random()-.5)*70,(Math.random()-.5)*70]);
      for (let c=0;c<3;c++){
        let v=d[i+c], avg=(d[i]+d[i+1]+d[i+2])/3;
        v = avg + (v-avg)*2.2;               // oversaturate
        v = (v-128)*1.5+128 + b[c] + (Math.random()-.5)*60; // crush contrast, block artifacts, grain
        d[i+c] = Math.round(Math.max(0,Math.min(255,v))/64)*64; // posterize
      }
    }
  }
  function split(d,w,h){
    const s=d.slice(), sh = 1 + (Math.random()<.4);
    for (let y=0;y<h;y++) for (let x=0;x<w;x++){
      const i=(y*w+x)*4, l=(y*w+Math.max(0,x-sh))*4, r=(y*w+Math.min(w-1,x+sh))*4;
      d[i]=s[l]; d[i+2]=s[r+2];
      d[i+3]=Math.max(s[i+3], s[l+3], s[r+3]);
      if (!s[i+3]) d[i+1]=0;
    }
  }
  function slices(d,w,h){
    const s=d.slice();
    let y=0;
    while (y<h){
      const band = 2 + (Math.random()*8|0), off = Math.random()<.5 ? 0 : ((Math.random()*9|0)-4);
      for (let yy=y; yy<Math.min(h,y+band); yy++) for (let x=0;x<w;x++){
        const sx=x-off, i=(yy*w+x)*4;
        if (sx<0||sx>=w){ d[i+3]=0; continue; }
        const j=(yy*w+sx)*4; d[i]=s[j]; d[i+1]=s[j+1]; d[i+2]=s[j+2]; d[i+3]=s[j+3];
      }
      y += band;
    }
  }
  function invert(d){ for (let i=0;i<d.length;i+=4){ if (!d[i+3]) continue; d[i]=255-d[i]; d[i+1]=255-d[i+1]; d[i+2]=255-d[i+2]; } }

  function renderPixel(t, res, s){
    const gw = res, gh = Math.round(res*LH/LW);
    if (buf.width!==gw || buf.height!==gh){ buf.width=gw; buf.height=gh; }
    bctx.setTransform(gw/LW,0,0,gh/LH,0,0);
    bctx.clearRect(0,0,LW,LH);
    drawDog(bctx, t);
    const img = bctx.getImageData(0,0,gw,gh), d = img.data;
    quantize(d);
    if (s==='fried') fried(d,gw,gh);
    if (s==='split') split(d,gw,gh);
    if (s==='slices') slices(d,gw,gh);
    if (s==='invert') invert(d);
    bctx.putImageData(img,0,0);
    vctx.setTransform(1,0,0,1,0,0);
    vctx.clearRect(0,0,view.width,view.height);
    vctx.imageSmoothingEnabled = false;
    vctx.drawImage(buf,0,0,view.width,view.height);
  }
  function renderSmooth(t){
    vctx.setTransform(1,0,0,1,0,0);
    vctx.clearRect(0,0,view.width,view.height);
    vctx.setTransform(k,0,0,k,0,0);
    vctx.imageSmoothingEnabled = true;
    drawDog(vctx, t);
  }

  function setMode(next){
    if (next===mode && !transition) return;
    const base = +ui.res.value;
    const now = performance.now();
    if (next==='rot'){
      transition = { steps:[120,60,base], i:0, at:now, fried:true, done(){ mode='rot'; state='pixel'; stateUntil=performance.now()+1500; } };
      ui.stage.classList.add('rot');
    } else {
      transition = { steps:[base,60,120], i:0, at:now, fried:false, done(){ mode='cool'; } };
      ui.stage.classList.remove('rot');
    }
    ui.cool.setAttribute('aria-pressed', next==='cool');
    ui.rot.setAttribute('aria-pressed', next==='rot');
    for (const b of ui.fx.querySelectorAll('button')) b.disabled = next!=='rot';
  }
  ui.cool.addEventListener('click', ()=>setMode('cool'));
  ui.rot.addEventListener('click', ()=>setMode('rot'));
  ui.fps.addEventListener('input', ()=>{ ui.fpsv.textContent = ui.fps.value; });
  ui.fx.addEventListener('click', e=>{ const b=e.target.closest('button'); if (b && mode==='rot' && !transition) trigger(b.dataset.s, performance.now()); });
  for (const b of ui.fx.querySelectorAll('button')) b.disabled = true;

  function frame(now){
    const t = now/1000;
    const fps = +ui.fps.value;
    const tq = Math.floor(t*fps)/fps;
    let label;

    if (transition){
      const step = transition.steps[transition.i];
      renderPixel(tq, step, transition.fried ? 'fried' : 'pixel');
      label = '切換中 · ' + step + '格';
      if (now - transition.at > 110){
        transition.i++; transition.at = now;
        if (transition.i >= transition.steps.length){ const t2=transition; transition=null; t2.done(); }
      }
    } else if (mode==='cool'){
      renderSmooth(reduce ? 0 : t);
      label = '向量 · 60fps';
    } else {
      if (ui.virus.checked && now > stateUntil) pickState(now);
      if (!ui.virus.checked && now > stateUntil) state='pixel';
      const res = +ui.res.value;
      if (state==='smooth'){ renderSmooth(t); }
      else if (state==='crunch'){ renderPixel(tq, Math.random()<.5?12:24, 'pixel'); }
      else renderPixel(reduce ? 0 : tq, res, state);
      label = NAMES[state] + ' · ' + (state==='smooth' ? '60' : fps) + 'fps';
    }
    if (ui.readout.textContent !== label) ui.readout.textContent = label;
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>

</body>
</html>
